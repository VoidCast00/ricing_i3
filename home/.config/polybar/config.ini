;; Polybar — Gruvbox Dark

[colors]
bg      = #282828
bg-alt  = #3c3836
bg2     = #504945
fg      = #ebdbb2
gray    = #a89984
red     = #fb4934
green   = #b8bb26
yellow  = #fabd2f
blue    = #83a598
purple  = #d3869b
aqua    = #8ec07c
orange  = #fe8019

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-right = 1
module-margin = 1
font-0 = "Hack Nerd Font:size=10;2"
modules-left = i3
modules-center = date
modules-right = pulseaudio backlight wlan eth cpu memory powerprofile battery tray
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.bg}
label-focused = %index%
label-focused-padding = 1
label-focused-background = ${colors.bg-alt}
label-focused-foreground = ${colors.orange}
label-focused-underline = ${colors.orange}
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.gray}
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-padding = 1
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
; click the clock to toggle seconds
time-alt = %H:%M:%S
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.orange}
label = %date%  %time%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.orange}
label-volume = %percentage%%
label-muted = "󰖁 muted"
label-muted-foreground = ${colors.gray}

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = false
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.aqua}
label-connected = %signal%%
label-disconnected = "󰖪 offline"
label-disconnected-foreground = ${colors.gray}

[module/eth]
type = internal/network
interface = enp0s31f6
interval = 3
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.aqua}
label-connected = %local_ip%
; hide entirely when no cable is plugged in
format-disconnected =

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.purple}
label = %percentage_used:2%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 15
poll-interval = 5
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.green}
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-foreground = ${colors.green}
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green}
label-full = full
format-low = <label-low>
label-low = "󰂃 %percentage%%"
label-low-foreground = ${colors.red}

[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/powerprofile.sh
tail = true
; left click cycles saver -> balanced -> perf, right click opens a picker
click-left = ~/.config/polybar/powerprofile.sh next
click-right = ~/.config/polybar/powerprofile.sh menu

[module/tray]
type = internal/tray
tray-spacing = 6px

[settings]
screenchange-reload = true
